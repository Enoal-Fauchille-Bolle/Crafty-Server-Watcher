# ═══════════════════════════════════════════════════════════════════
# Crafty Server Watcher — configuration
# ═══════════════════════════════════════════════════════════════════
# Copy this file to /etc/crafty-server-watcher/config.yaml and edit.
# The API token is NOT stored here — set the environment variable
# referenced by crafty.api_token_env (default: CRAFTY_API_TOKEN).
# ═══════════════════════════════════════════════════════════════════

# ── Crafty API connection ───────────────────────────────────────
crafty:
  base_url: "https://crafty_ip:8443"   # IP address of the Crafty server
  api_token_env: "CRAFTY_API_TOKEN"    # env var that holds the token
  verify_tls: true                      # true for Let's Encrypt certs

# ── Servers to manage ───────────────────────────────────────────
# Each key is a friendly name.  You need the Crafty server UUID
# (visible in the Crafty dashboard URL or via GET /api/v2/servers).
servers:
  vanilla:
    crafty_server_id: "5adcec83-684c-4555-a7e9-9d913203d07e"
    listen_port: 25565
    listen_host: "0.0.0.0"
    edition: java               # "java" (TCP) or "bedrock" (UDP/RakNet)
    idle_timeout_minutes: 10
    start_timeout_seconds: 180
    motd_hibernating: "§7⏳ Server is hibernating. Connect to wake it up!"
    kick_message: "§eServer is starting up!\n§7Please reconnect in about 60 seconds."

    # ── Who may wake this server ──────────────────────────────
    # Internet-wide scanners find open Minecraft ports within hours.
    # Without this, every one of them boots your server: the server's
    # own whitelist refuses them at the door, but the JVM is already up
    # and holding RAM.  Refusing here costs nothing.
    #
    # Java edition only — the Bedrock/RakNet handshake carries no player
    # name for the proxy to check.
    #
    # NOTE: the name comes from the Login Start packet, before Mojang
    # authentication — it is a claim, not a proof.  This stops scanners
    # trying arbitrary names; it is not a security boundary.
    access:
      mode: whitelist           # "off" (default) or "whitelist"
      # Reuse the server's own whitelist.json, so there is only one list
      # to maintain.  Re-read automatically when the file changes.
      whitelist_file: "/servers/5adcec83-684c-4555-a7e9-9d913203d07e/whitelist.json"
      # Extra names allowed to wake the server without being able to play.
      allowed_players: []
      deny_message: "§cThis server is private.\n§7You are not on the whitelist."

  modded:
    crafty_server_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
    listen_port: 25566
    listen_host: "0.0.0.0"
    edition: java
    idle_timeout_minutes: 15
    start_timeout_seconds: 300
    motd_hibernating: "§7⏳ Modded server sleeping. Connect to wake it!"
    kick_message: "§eModded server is booting!\n§7Please reconnect in ~2 minutes."

  bedrock-survival:
    crafty_server_id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
    listen_port: 19132
    listen_host: "0.0.0.0"
    edition: bedrock            # Bedrock uses UDP (RakNet) on port 19132
    idle_timeout_minutes: 10
    start_timeout_seconds: 120
    motd_hibernating: "Server hibernating - connect to wake up!"

# ── Polling ─────────────────────────────────────────────────────
polling:
  interval_seconds: 30
  api_retry_delay_seconds: 10
  api_max_retries: 3

# ── Anti-flap / cooldowns ──────────────────────────────────────
cooldowns:
  stop_cooldown_minutes: 5
  start_grace_minutes: 3
  flap_window_minutes: 30
  flap_max_cycles: 3
  flap_backoff_minutes: 10

# ── Logging ─────────────────────────────────────────────────────
logging:
  level: "INFO"
  file: "/var/log/crafty-server-watcher/service.log"
  max_bytes: 10485760    # 10 MB
  backup_count: 5

# ── Webhook notifications ─────────────────────────────────────
# Sends Discord embeds (or generic JSON POST) on:
#   server started, stopped, crashed
webhook:
  enabled: false
  url: "https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN"
  label: "Crafty Server Watcher"    # shown in embed footer
  # Minimum gap between two "wake-up denied" notifications for the same
  # server.  A scanner retrying every few seconds must not flood the
  # channel or trip Discord's rate limit.
  denied_notify_cooldown_minutes: 60

# ── State persistence ─────────────────────────────────────────
# Idle countdowns live in memory.  Without this file, every restart
# (container recreation, image update, reboot) resets them — a watcher
# restarted more often than idle_timeout_minutes can NEVER shut a
# server down.  Leave the path empty to disable.
state:
  file: "/data/state.json"
# ── Health endpoint ───────────────────────────────────────────
health:
  enabled: true           # set to false to disable
  host: "127.0.0.1"       # bind address (use 0.0.0.0 to expose)
  port: 8095              # GET /health and GET /status

# Receives Crafty's own per-server webhooks, on the health server above.
# Without it, everything the watcher did not decide itself is a poll interval
# late — and the port is in the wrong hands for that whole interval.
#
#   start_server    : a server started from the Crafty console dies with
#                     "FAILED TO BIND TO PORT", because the watcher is still
#                     holding that port.  Crafty fires the event milliseconds
#                     after spawning the JVM, which binds a few seconds later
#                     — enough time to step off the port.
#   stop_server     : once the server is down nobody is listening on the port,
#   kill              so a player pinging gets a refused connection instead of
#   crash_detected    the hibernating MOTD, and a player connecting does not
#                     wake the server at all.  These events put the watcher
#                     back on the port right away.
#
# In Crafty: Server -> Config -> Webhooks -> New webhook
#   Type    : Discord   (any provider works; only the URL and body matter)
#   URL     : http://127.0.0.1:8095/events/crafty?token=<same token as below>
#   Triggers: start_server, stop_server, kill, crash_detected
#             (the trigger is `start_server`, NOT "server_start")
#   Body    : {"server_id": "{{ server_id }}", "event": "{{ event_type }}"}
crafty_events:
  enabled: false
  path: "/events/crafty"
  # Shared secret. The endpoint is bound to localhost, but every container on
  # the host network shares that localhost — including Crafty itself.
  token: ""

